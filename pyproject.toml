[project]
name = "tokenshield"
version = "0.1.0"
description = "Observable, reversible context optimization proxy for desktop AI agents"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "httpx>=0.28,<1",
  "pydantic-settings>=2.7,<3",
  "tiktoken>=0.9,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.25", "ruff>=0.9"]

[project.scripts]
tokenshield = "tokenshield.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
